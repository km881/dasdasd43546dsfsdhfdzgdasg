險見各行程卡『廁所』欄(標 🚻)。","id":"n02","ti":"🚻 廁所風險:原則與對策"},"n03":{"body":"成員作息:Dennis、Rachel、Gary、爸爸、媽媽。父母於 22:00(日本時間)就寢,早上約 06:15 可起床。Gary 習慣 07:00–08:00 起床,故清晨行程只由 Dennis 陪同父母。父母不懂英文及日文,任何時間至少要有 Dennis / Rachel / Gary 其中一人同行。\n\n原則:不設酒店午休(往回耗時);每日主行程 + ☆ 輕鬆活動(非優先)+ 輪值自由時間;午餐 12:00–13:00 開始、晚餐 18:00–19:00 開始。京都各日晚餐盡量安排於京都站附近。父母可『跟隨、不跟隨、分開』三選一。\n\n輪值:Day 2 午餐後在 AEON Mall 分兩組(Dennis + Gary + 爸爸 / 媽媽 + Rachel);Day 3 午餐後分開(Rachel + Gary 往四条;Dennis + 父母待定);Day 4 Dennis 自由(teamLab 之後);Day 5 午餐後全員;Day 6 全員去三井 Outlet;Day 7 Rachel + Gary Porto Europa;Day 8 全員 Rinku。","id":"n03","ti":"👥 作息與輪值原則"},"n04":{"body":"JMC 10 月 1 日更新:京都紅葉約 12 月 11 日見頂、大阪約 12 月 4 日;Weathernews 預測嵐山約 11 月 24 日。兩邊差距大,11 月底再看。\n\n安排:Day 2 嵐山 → Day 3 清水寺 → Day 4 宇治 → Day 5 大阪城 → Day 6 奈良。若 11 月底預測偏早,把嵐山與清水寺提前。","id":"n04","ti":"🍁 紅葉預測"},"n05":{"body":"嚴格:午餐 12:00–13:00 開始、晚餐 18:00–19:00 開始;每日(Day 1 除外)至少一餐有米飯;魚類一律熟食(非刺身,只有 Dennis + Gary 可吃壽司 / 海鮮丼)。不必每餐吃魚;爸爸可選炸豬排、天婦羅、親子丼、燒肉、壽喜燒、鰻魚飯等。\n\nDay 1 拉麵不另加飯(父母午餐已自備飯食)。行程板會自動檢查餐點時間與『每日有飯』(Day 1 除外),見頂部『提醒』。","id":"n05","ti":"🍚🐟 餐點規則"},"n06":{"body":"已核對:GO Van 規則與區域、Yodobashi 營業時間、京都塔、AEON Mall / Porta 營業時間、溫泉資料、蟹道樂午晚餐價錢;東寺、西本願寺、東本願寺、清水寺開門時間;住吉大社、奈良公園、大阪城公園、伏見稻荷廁所資料;紀州路快速車內有廁所;Airport Express 車程。\n\n車費、泳池、咖啡店營業時間、多數巴士 / 電車車費為估算或舊資料,出發前請核實。GO Van 最終價格以 app 顯示為準(可能因時段而變)。標「未核實」者請出發前核對。\n\n已取消:鰻家 / 新大阪午餐、指定中菜、Day 7 大阪城(改 Day 8 早上)、Dennis 提早去新大阪、Day 2 Gary 去伏見稻荷。\n\n費用欄位:全部是按 v6 資料的估算(每人票價 × 人數),請按實際更新。\n\n11/8 更新:路線改為京都(Day 1–4)→ 難波(Day 5–6)→ 和歌山(Day 7)→ Rinku Outlet → 關西機場(Day 8)。奈良保留(Day 6 上午)。新增:三井 Outlet 門真(Day 6)、蟹吃到飽(Day 5)、和牛壽喜燒放題(Day 6)、東寺夜間(Day 3,可選)、御堂筋燈飾(Day 5,可選)。新資料來源為官方網站及訂位網站;Instagram / Threads 貼文系統無法讀取,內容按你貼的文字處理。","id":"n06","ti":"📋 核實備註"},"n07":{"body":"足夠看完經典重點:天龍寺庭園(約 40–60 分鐘)、竹林小徑(約 20 分鐘)、嵯峨野小火車(約 25 分鐘)。合共約 4 小時(08:45–12:30)。\n\n不足之處:渡月橋、大河內山莊(約 ¥1,000,17:00 前關門)、野宮神社、嵐山吃喝逛街、猴子公園都會省略;小火車回程需步行至馬堀站再乘 JR,約耗 1 小時。若希望更悠閒,可把 teamLab 與嵐山對調,或把嵐山延至 14:00 並在嵐山用午餐。父母步速較慢,半天已是合理上限。","id":"n07","ti":"🗺 嵐山半天是否足夠?"},"n08":{"body":"原順序:京都 → 和歌山 → 大阪,交通時間偏長(Rachel 不想)。\n新順序:京都 → 難波(2 晚)→ 和歌山(1 晚)→ Rinku Outlet → 關西機場。\n\n交通估算:原約 5 小時(京都 → 和歌山 → Rinku → 難波 → 機場),新約 3 小時 50 分(京都 → 難波 1 小時、難波 → 和歌山約 1 小時 40 分、和歌山 → Rinku 約 1 小時、Rinku → 機場 5 分鐘)。均為估算。\n\n酒店:京都 5–8/12(已訂 RIHGA)、難波 9–10/12、和歌山 11/12;三者後兩者尚未訂。\n\nDay 6 較滿:上午奈良、下午三井、晚上和牛放題(約 21:00 回酒店)。如父母太累,可取消晚餐放題,改在 LaLaport 內用餐。\n\nCostco 門真:須會員卡(Gold Star 約 ¥5,280/年),遊客辦理規則未查到,未排入時間表。\n\n11/8 再更新(Day 2–4):嵐山提前到 Day 2(紅葉較早)並加入 AEON Mall 男女分組購物;Day 3 保留清水寺,午餐後 Rachel + Gary 逛四条、Dennis 與父母待定;Day 4 改宇治半天,下午 teamLab 以後維持原排法。","id":"n08","ti":"🛣 11/8 路線變更記錄"}},"cfg":{"main":{"days":[{"date":"5/12","dow":"六","n":1,"title":"抵達京都"},{"date":"6/12","dow":"日","n":2,"title":"嵐山 + AEON Mall"},{"date":"7/12","dow":"一","n":3,"title":"清水寺 + 錦市場 + 四条 + 東寺夜間"},{"date":"8/12","dow":"二","n":4,"title":"宇治 + teamLab"},{"date":"9/12","dow":"三","n":5,"title":"京都 → 難波 + 大阪城"},{"date":"10/12","dow":"四","n":6,"title":"奈良 + 三井 Outlet"},{"date":"11/12","dow":"五","n":7,"title":"難波 → 和歌山"},{"date":"12/12","dow":"六","n":8,"title":"Rinku Outlet + 回程"}],"helpers":["D","R","G"],"people":[{"id":"D","name":"Dennis"},{"id":"R","name":"Rachel"},{"id":"G","name":"Gary"},{"id":"F","name":"爸爸"},{"id":"M","name":"媽媽"}],"rate100":4.9,"riceExempt":[1],"title":"日本 2026 家庭行程板"}},"places":{"p001":{"cat":"food","day":1,"desc":"","fz":"g","id":"p001","lat":34.435469,"lng":135.2453451,"nm":"KIX Airport Lounge","rg":"大阪","src":"Rachel","why":"與 Day 1「JR Haruka 特急往京都(」 同區(約 0.2 公里,步行可達),可考慮插入。"},"p002":{"cat":"shop","day":8,"desc":"有間ASOKO 雜貨家品店好多sanrio野買*v*; rilakkuma store; 大阪府吹田市千里万博公園2-1; ららぽーとEXPOCITY1階; 10-9pm; ; EXPO CITY; 大阪府吹田市千里万博公園2-1; Open - 11:00〜22:00; ◆ Food Last order - 21:00; ◆ Drink Last order - 21:30","fz":"r","id":"p002","lat":34.805489,"lng":135.5344664,"nm":"LaLaport Expocity(Gundam Square)","rg":"大阪","src":"Rachel","why":"不順路:距最近行程點 Day 8「退房,行李寄存酒店前台,難波 →」 約 13 公里,需半日以上來回。"},"p003":{"cat":"shop","day":6,"desc":"大阪府泉佐野市りんくう往来南３−２８; 1000－2000","fz":"in","id":"p003","lat":34.4079029,"lng":135.2948118,"nm":"Rinku <script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyDBP2cPxwlxlFmbrowfuNitkY1GcTW7x1k",
    authDomain: "japan-abcd12355.firebaseapp.com",
    projectId: "japan-abcd12355",
    storageBucket: "japan-abcd12355.firebasestorage.app",
    messagingSenderId: "177534848608",
    appId: "1:177534848608:web:ffa4c93ac1e20e7a9bbd05"
  };

  firebase.initializeApp(firebaseConfig);
  const fbDb = firebase.firestore();

  function download(name, text, type) {
    const blob = new Blob([text], { type: type || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  async function seedIfEmpty() {
    try {
      const snap = await fbDb.collection('items').limit(1).get();
      if (snap.empty) {
        console.log("正在自動上傳原始種子行程資料至 Firestore...");
        const SEED = JSON.parse(document.getElementById('seed').textContent);
        const batches = [fbDb.batch()];
        let count = 0;

        const addOp = (ref, data) => {
          let b = batches[batches.length - 1];
          if (count >= 400) {
            b = fbDb.batch();
            batches.push(b);
            count = 0;
          }
          b.set(ref, data);
          count++;
        };

        for (const [id, item] of Object.entries((SEED.cols && SEED.cols.items) || {})) {
          addOp(fbDb.doc('items/' + id), item);
        }
        for (const [id, todo] of Object.entries((SEED.cols && SEED.cols.todos) || {})) {
          addOp(fbDb.doc('todos/' + id), todo);
        }
        for (const [id, note] of Object.entries((SEED.cols && SEED.cols.notes) || {})) {
          addOp(fbDb.doc('notes/' + id), note);
        }
        for (const [id, place] of Object.entries((SEED.cols && SEED.cols.places) || {})) {
          addOp(fbDb.doc('places/' + id), place);
        }
        if (SEED.cols && SEED.cols.cfg) {
          addOp(fbDb.doc('cfg/main'), SEED.cols.cfg.main || SEED.cols.cfg);
        }

        await Promise.all(batches.map(b => b.commit()));
        console.log("種子資料同步至雲端完成！");
      }
    } catch (e) {
      console.warn("檢查或寫入種子資料時提示:", e);
    }
  }
  seedIfEmpty();

  window.claude = {
    use: async function(n) {
      if (n === 'db') return fbDb;
      if (n === 'user') return { can: () => true, isOwner: () => true, canEdit: () => true };
      if (n === 'downloads') {
        return {
          save: async o => {
            download(o.filename, typeof o.data === 'string' ? o.data : JSON.stringify(o.data));
          }
        };
      }
      return null;
    }
  };
})();

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const parseT=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?Math.min(1439,+m[1]*60+ +m[2]):null};
const snap=(v,n)=>Math.round(v/n)*n;
const yen=n=>'¥'+Math.round(n).toLocaleString('en-US');

const PEOPLE=[{id:'D',name:'Dennis',ch:'D'},{id:'R',name:'Rachel',ch:'R'},{id:'G',name:'Gary',ch:'G'},{id:'F',name:'爸爸',ch:'爸'},{id:'M',name:'媽媽',ch:'媽'}];
const PIDS=PEOPLE.map(p=>p.id), HELPERS=['D','R','G'], PARENTS=['F','M'];
const pname=id=>(PEOPLE.find(p=>p.id===id)||{}).name||id;
const CATS={move:'交通',meal:'餐飲',sight:'景點',shop:'購物',rest:'休息',sport:'晨運',free:'自由時間',hotel:'住宿 / 行李',other:'其他'};
const MEALS={B:'早餐',L:'午餐',D:'晚餐',S:'點心'};
const TAGS={fish:['🐟','魚'],rice:['🍚','飯'],wc:['🚻','廁所'],diet:['🥢','飲食限制'],opt:['☆','可選']};
const WCL={low:'低',mid:'中',high:'高'};
const POOLS={early:'清晨備案',rain:'雨天 / 備案',wish:'願望清單'};
const STATUS={none:'—',todo:'待預約',done:'已預約'};
const URG=['盡快','11 月 8 日前後','11 月內','11 月底','出發前 7–10 日','出發前','9/12 早上','待補'];
const CKEY='jpboard-cache-v1';

const S={items:new Map(),todos:new Map(),notes:new Map(),places:new Map(),pf:{rg:'',fz:'nr',cat:''},ff:{t:'all'},cfg:{},view:'board',day:1,sel:null,edit:false,
  who:null,tag:null,q:'',pool:'early',exp:new Set(),editNote:null,alerts:false,
  live:false,ro:false,fromCache:false,got:{items:false},undo:[],redo:[],armDel:false};
let DB=null, USER=null, dragging=false, dirty=false, renderQ=0;

try{const h=(location.hash||'').slice(1);if(['board','timeline','todo','food','places','info'].includes(h))S.view=h}catch(e){}

/* ---------- data helpers ---------- */
function norm(o,id){
  const x=Object.assign({},o||{});x.id=id;
  x.day=Math.max(0,Math.min(20,Math.round(+x.day)||0));
  x.st=Math.max(0,Math.min(1439,Math.round(+x.st)||0));
  x.du=Math.max(5,Math.min(1440,Math.round(+x.du)||60));
  x.who=Array.isArray(x.who)?x.who.filter(p=>PIDS.includes(p)):[];
  x.tg=Array.isArray(x.tg)?x.tg.filter(t=>TAGS[t]):[];
  x.cost=(x.cost==null||x.cost==='')?null:(+x.cost||0);
  x.ord=+x.ord||0;
  for(const k of ['ti','tr','tx','lv','grp','notes','bk','place','wc'])x[k]=x[k]==null?'':String(x[k]);
  if(!CATS[x.cat])x.cat='other';
  if(!MEALS[x.meal])x.meal=null;
  if(!STATUS[x.status])x.status='none';
  if(!WCL[x.wcl])x.wcl=null;
  x.est=!!x.est;
  if(x.day===0&&!POOLS[x.pool])x.pool='early';
  return x;
}
const cmp=(a,b)=>a.st-b.st||a.ord-b.ord||(a.id<b.id?-1:1);
const itemsOf=d=>[...S.items.values()].filter(x=>x.day===d).sort(cmp);
const rate=()=>{const r=+S.cfg.rate100;return r>0?r:0};
const hkd=n=>{const r=rate();return r?'HK$'+Math.round(n*r/100).toLocaleString('en-US'):''};
function days(){
  const c=Array.isArray(S.cfg.days)?S.cfg.days:[];
  let max=Math.max(8,...[...S.items.values()].map(x=>x.day));
  const out=[];
  for(let n=1;n<=max;n++){const d=c.find(z=>+z.n===n)||{};out.push({n,date:d.date||'',dow:d.dow||'',title:d.title||''})}
  return out;
}
const dlabel=d=>`Day ${d.n}`+(d.date?` · ${d.date}`:'')+(d.dow?`(${d.dow})`:'');
function newId(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function blank(day,st){
  return norm({day,st,du:60,ti:'新行程',cat:'other',who:PIDS.slice(),tg:[],status:'none',ord:0},newId());
}

/* ---------- warnings ---------- */
function computeWarnings(){
  const W=new Map(), D=new Map();
  const add=(m,k,t)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(t)};
  for(const d of days()){
    const L=itemsOf(d.n);
    for(const x of L){
      const par=x.who.some(p=>PARENTS.includes(p)), help=x.who.some(p=>HELPERS.includes(p));
      const en=x.st+x.du;
      if(par&&!help)add(W,x.id,'父母無人陪同:須有 Dennis / Rachel / Gary 其中一人同行');
      if(par&&en>22*60)add(W,x.id,'父母 22:00 就寢,此項至 '+fmt(Math.min(en,1439)));
      if(x.meal==='L'&&(x.st<720||x.st>780))add(W,x.id,'午餐應於 12:00–13:00 開始(現為 '+fmt(x.st)+')');
      if(x.meal==='D'&&(x.st<1080||x.st>1140))add(W,x.id,'晚餐應於 18:00–19:00 開始(現為 '+fmt(x.st)+')');
    }
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
      const a=L[i],b=L[j];
      if(b.st>=a.st+a.du)continue;
      const both=a.who.filter(p=>b.who.includes(p));
      if(both.length){
        const n=both.map(pname).join('、');
        add(W,a.id,`${n} 同時安排於『${b.ti}』(${fmt(b.st)})`);
        add(W,b.id,`${n} 同時安排於『${a.ti}』(${fmt(a.st)})`);
      }
    }
    if(L.length&&!(Array.isArray(S.cfg.riceExempt)&&S.cfg.riceExempt.includes(d.n))&&!L.some(x=>x.meal&&x.tg.includes('rice')))add(D,d.n,`Day ${d.n} 未安排有米飯的一餐`);
  }
  return {W,D};
}

/* ---------- cost ---------- */
function costs(){
  const by={};let must=0,opt=0;
  for(const x of S.items.values()){
    if(!x.day||!x.cost)continue;
    const b=by[x.day]||(by[x.day]={must:0,opt:0});
    if(x.tg.includes('opt')){b.opt+=x.cost;opt+=x.cost}else{b.must+=x.cost;must+=x.cost}
  }
  return {by,must,opt};
}

/* ---------- persistence ---------- */
function saveCache(){
  clearTimeout(saveCache.t);
  saveCache.t=setTimeout(()=>{try{
    localStorage.setItem(CKEY,JSON.stringify({ts:Date.now(),places:[...S.places.values()],items:[...S.items.values()],todos:[...S.todos.values()],notes:[...S.notes.values()],places:[...S.places.values()],cfg:S.cfg}));
  }catch(e){}},900);
}
function loadCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CKEY)||'null');
    if(!c||!Array.isArray(c.items)||!c.items.length)return false;
    c.items.forEach(o=>S.items.set(o.id,norm(o,o.id)));
    (c.todos||[]).forEach(o=>S.todos.set(o.id,o));
    (c.notes||[]).forEach(o=>S.notes.set(o.id,o));
    (c.places||[]).forEach(o=>S.places.set(o.id,o));
    S.cfg=c.cfg||{};S.fromCache=true;S.got.items=true;return true;
  }catch(e){return false}
}
let wq=Promise.resolve();
function toast(t,ms){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>{el.style.display='none'},ms||2600)}
function wr(fn){
  wq=wq.then(fn).catch(e=>{
    const c=e&&e.code;
    if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){S.ro=true;toast('此帳戶未有修改權限,只能檢視');}
    else toast('儲存失敗,請檢查網絡連線('+(c||'錯誤')+')');
    chrome();
  });
}
function put(col,id,obj){
  if(!DB){toast('未連線,暫時只能檢視');return}
  const ref=DB.doc(col+'/'+id);
  wr(()=>obj?ref.set(obj):ref.delete());
}
const store={items:S.items,todos:S.todos,notes:S.notes,places:S.places};
function localApply(col,id,obj){
  if(col==='cfg'){S.cfg=obj||{};return}
  const m=store[col];if(!m)return;
  if(obj)m.set(id,col==='items'?norm(obj,id):obj);else m.delete(id);
}
function commit(changes,label){
  changes=changes.filter(c=>JSON.stringify(c.before)!==JSON.stringify(c.after));
  if(!changes.length)return;
  for(const c of changes){localApply(c.col,c.id,c.after);put(c.col,c.id,c.after)}
  S.undo.push({changes,label});if(S.undo.length>60)S.undo.shift();S.redo=[];
  saveCache();render();
}
function undo(){
  const e=S.undo.pop();if(!e)return;
  for(const c of e.changes){localApply(c.col,c.id,c.before);put(c.col,c.id,c.before)}
  S.redo.push(e);saveCache();render();toast('已撤銷'+(e.label?':'+e.label:''));
}
function redo(){
  const e=S.redo.pop();if(!e)return;
  for(const c of e.changes){localApply(c.col,c.id,c.after);put(c.col,c.id,c.after)}
  S.undo.push(e);saveCache();render();toast('已還原'+(e.label?':'+e.label:''));
}
const cl=o=>o?JSON.parse(JSON.stringify(o)):null;
function chg(id,patch,label){
  const b=S.items.get(id);if(!b)return;
  commit([{col:'items',id,before:cl(b),after:Object.assign(cl(b),patch)}],label||'修改');
}

/* ---------- placement (board drop) ---------- */
function placeChanges(item,day,idx,pool){
  const list=itemsOf(day).filter(x=>x.id!==item.id);
  const prev=list[idx-1],next=list[idx];
  let st=item.st;
  const lo=prev?prev.st:0,hi=next?next.st:1439;
  if(st<lo||st>hi)st=next?next.st:Math.min(1380,snap(prev?prev.st+prev.du:540,5));
  const before=list.slice(0,idx).filter(x=>x.st===st);
  const after=list.slice(idx).filter(x=>x.st===st);
  const group=[...before,item,...after];
  const out=[];
  group.forEach((g,i)=>{
    if(g.id===item.id){
      const a=Object.assign(cl(item),{day,st,ord:i});
      if(day===0)a.pool=pool||item.pool||'early';
      out.push({col:'items',id:item.id,before:cl(S.items.get(item.id))||null,after:a});
    }else if(g.ord!==i)out.push({col:'items',id:g.id,before:cl(g),after:Object.assign(cl(g),{ord:i})});
  });
  return out;
}

const PX=1.1;
function renderTimeline(){
  const d=S.day,L=itemsOf(d),W=S._W,dd=days().find(z=>z.n===d)||{n:d,date:'',dow:'',title:''};
  const t0=Math.floor(Math.min(360,...L.map(x=>x.st))/60)*60;
  const t1=Math.ceil(Math.max(1320,...L.map(x=>x.st+x.du))/60)*60;
  S._t0=t0;S._t1=t1;
  // lanes
  const lane=new Map(),clusterOf=[];let cur=[],end=-1;
  const sorted=L.slice().sort((a,b)=>a.st-b.st||b.du-a.du);
  const flush=()=>{const n=Math.max(1,...cur.map(x=>lane.get(x.id)+1));cur.forEach(x=>clusterOf.push([x,n]));cur=[]};
  for(const x of sorted){
    if(cur.length&&x.st>=end)flush();
    const used=new Set(cur.filter(y=>y.st+y.du>x.st).map(y=>lane.get(y.id)));
    let k=0;while(used.has(k))k++;
    lane.set(x.id,k);cur.push(x);end=cur.length===1?x.st+x.du:Math.max(end,x.st+x.du);
  }
  flush();
  const H=(t1-t0)*PX;
  let lines='',axis='';
  for(let m=t0;m<=t1;m+=30){
    const y=(m-t0)*PX;
    lines+=`<div class="tl-line ${m%60?'half':''}" style="top:${y}px"></div>`;
    if(m%60===0)axis+=`<span style="top:${y}px">${fmt(m)}</span>`;
  }
  const items=clusterOf.map(([x,n])=>{
    const k=lane.get(x.id),top=(x.st-t0)*PX,h=Math.max(22,x.du*PX-1);
    const w=S._W.get(x.id);
    return `<div class="tl-item ${dimmed(x)?'dim':''} ${S.sel===x.id?'sel':''}" data-id="${esc(x.id)}" style="--cc:var(--c-${x.cat});top:${top}px;height:${h}px;left:calc(${k*100/n}% + 2px);width:calc(${100/n}% - 4px)" tabindex="0" role="button" aria-label="${esc(x.ti)}">
      <span class="grip" title="拖動">⠿</span><div><span class="t">${fmt(x.st)}–${fmt(Math.min(1439,x.st+x.du))}</span> ${w?`<span class="warn" title="${esc(w.join('\n'))}">⚠</span>`:''}</div>
      <div class="tt">${esc(x.ti)}</div>${h>58?`<div>${avs(x.who,x.id)}</div>`:''}${h>82&&x.cost?`<div class="cost" style="margin:0">${yen(x.cost)}</div>`:''}<div class="rs" title="拖動改時長"></div></div>`;
  }).join('');
  const tabs=days().map(z=>`<button class="dtab dropday" data-act="day" data-d="${z.n}" aria-pressed="${z.n===d}">Day ${z.n}<small>${esc(z.date)}${z.dow?`(${esc(z.dow)})`:''}</small></button>`).join('');
  const c=costs().by[d]||{must:0,opt:0};
  return `<div class="tl-head">${tabs}<button class="btn" data-act="addday" data-d="${d}">＋ 新增行程</button></div>
    <div class="sum" style="margin:0 0 8px;color:var(--mute)"><b style="font-family:var(--serif);color:var(--ink)">${esc(dlabel(dd))}</b> ${esc(dd.title)} · ${L.length} 項${c.must?` · ${yen(c.must)}${hkd(c.must)?' ≈ '+hkd(c.must):''}`:''} · 拖曳卡片可改時間(15 分鐘一格),拖曳底邊可改時長,拖至上方日期分頁可轉日</div>
    <div class="tl"><div class="tl-axis" style="height:${H}px">${axis}</div><div class="tl-grid" id="tlg" style="height:${H}px">${lines}${items}</div></div>`;
}

const FZ={in:['已排入','in'],g:['同區 · 可考慮','g'],y:['需另排時段','y'],r:['不建議 / 不順路','r'],'':['未評','']};
const PCAT={food:'餐飲',shop:'購物',sight:'景點',hotel:'住宿',other:'其他'};
const PRG=['京都','大阪','奈良','和歌山','神戶','其他'];
function placeVisible(p){
  const f=S.pf;
  if(f.rg&&p.rg!==f.rg)return false;
  if(f.cat&&p.cat!==f.cat)return false;
  if(f.fz==='nr'){if(p.fz==='r')return false}

document.addEventListener('pointerdown',e=>{

  if((el=t.closest('[data-person]')))kind='person';
  else if((el=t.closest('.rs')))kind='resize';
  else if((el=t.closest('.card[data-id]'))){kind='card';if(e.pointerType==='touch'&&!t.closest('.grip'))return}
  else if((el=t.closest('.tl-item[data-id]'))){kind='tl';if(e.pointerType==='touch'&&!t.closest('.grip'))return}
  if(!kind)return;
  const holder=kind==='person'?el.closest('[data-id]'):el.closest('[data-id]');
  const id=kind==='person'?(el.dataset.from||''):(holder?holder.dataset.id:'');
  const r=(kind==='resize'?holder:el).getBoundingClientRect();
  drag={kind,el,id,person:el.dataset.person,from:el.dataset.from||'',sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,on:false,alt:e.altKey,target:null,rect:r,x:e.clientX,y:e.clientY};
  if(kind==='resize'){drag.item=holder;drag.du0=S.items.get(id).du}
  if(kind==='tl'){drag.top0=parseFloat(el.style.top);drag.st0=S.items.get(id).st}
});

});

  if(k==='card'){
    const g=drag.el.cloneNode(true);g.classList.add('ghost');g.classList.remove('src','sel');
    g.style.width=drag.rect.width+'px';document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('src');
  }else if(k==='person'){
    const g=document.createElement('div');g.className='pchip card ghost';g.style.cssText='padding:3px 10px 3px 4px;border-left:1px solid var(--line);transform:none';
    const av=drag.el.classList.contains('av')?drag.el.cloneNode(true):drag.el.querySelector('.av').cloneNode(true);
    g.appendChild(av);g.append(' '+(drag.person==='ALL'?'全員':pname(drag.person)));document.body.appendChild(g);drag.ghost=g;drag.ox=14;drag.oy=14;
  }else if(k==='tl'){drag.el.classList.add('lift')}
  else if(k==='resize'){drag.item.classList.add('lift')}
}
function autoscroll(){
  const y=drag.y,h=innerHeight;
  if(y<70)scrollBy(0,-14);else if(y>h-70)scrollBy(0,14);
  const b=$('#boardEl');
  if(b&&drag.kind==='card'){const r=b.getBoundingClientRect();if(drag.y>r.top&&drag.y<r.bottom+200){if(drag.x<r.left+70)b.scrollLeft-=16;else if(drag.x>r.right-70)b.scrollLeft+=16}}
}
function updateDrag(e){
  const k=drag.kind;
  if(drag.ghost){drag.ghost.style.left=(drag.x-drag.ox)+'px';drag.ghost.style.top=(drag.y-drag.oy)+'px'}
  autoscroll();
  clearHints();
  drag.target=null;
  if(k==='resize'){
    const du=Math.max(15,snap(drag.du0+(drag.y-drag.sy)/PX,15));
    drag.du=du;drag.item.style.height=Math.max(22,du*PX-1)+'px';return;
  }
  const under=document.elementFromPoint(drag.x,drag.y);if(!under)return;
  if(k==='person'){
    if(under.closest('#trash')&&drag.from){trashEl().classList.add('hot');drag.target={type:'untag'};return}
    const c=under.closest('.card[data-id],.tl-item[data-id]');
    if(c&&!c.classList.contains('ghost')){c.classList.add('hot');drag.target={type:'person',id:c.dataset.id}}
    return;
  }
  const trash=under.closest('#trash'),dtab=under.closest('.dropday');
  if(trash){trash.classList.add('hot');drag.target={type:'trash'};if(k==='tl')tlPos();return}
  if(dtab){dtab.classList.add('hot');drag.target={type:'day',day:+dtab.dataset.d};if(k==='tl')tlPos();return}
  const pool=under.closest('.pool-body');
  if(pool){pool.classList.add('hot');drag.target={type:'pool'};if(k==='tl')tlPos();return}
  const col=under.closest('.col');
  if(col&&k==='card'){
    col.classList.add('hot');
    const body=$('.col-b',col),cards=$$(':scope > .card:not(.src)',body);
    let idx=cards.length;
    for(let i=0;i<cards.length;i++){const r=cards[i].getBoundingClientRect();if(drag.y<r.top+r.height/2){idx=i;break}}
    const ind=document.createElement('div');ind.className='ind';
    body.insertBefore(ind,cards[idx]||null);
    $('.empty',body)&&$('.empty',body).remove();
    drag.target={type:'col',day:+col.dataset.day,idx};return;
  }
  const g=under.closest('.tl-grid');
  if(g&&k==='card'){
    const gr=g.getBoundingClientRect(),it=S.items.get(drag.id);
    const st=Math.max(S._t0,Math.min(S._t1-15,snap(S._t0+(drag.y-gr.top)/PX,15)));
    const gh=document.createElement('div');gh.className='tl-ghost';gh.style.top=(st-S._t0)*PX+'px';gh.style.height=Math.max(22,it.du*PX)+'px';g.appendChild(gh);
    drag.target={type:'tl',st};return;
  }
  if(k==='tl')tlPos();
}
function tlPos(){
  const it=S.items.get(drag.id);
  const st=Math.max(S._t0,Math.min(S._t1-it.du,snap(drag.st0+(drag.y-drag.sy)/PX,15)));
  drag.newSt=st;drag.el.style.top=(st-S._t0)*PX+'px';
}
function endDrag(e,cancel){
  const d=drag;suppress=true;setTimeout(()=>{suppress=false},60);
  document.body.classList.remove('dragging','noselect');
  clearHints();
  if(d.ghost)d.ghost.remove();
  d.el.classList.remove('src','lift');if(d.item)d.item.classList.remove('lift');
  dragging=false;
  const T=d.target;
  if(!cancel){
    if(d.kind==='resize'&&d.du&&d.du!==d.du0)chg(d.id,{du:d.du},'時長');
    else if(d.kind==='person'&&T){
      if(T.type==='untag'){const x=S.items.get(d.from);if(x)chg(x.id,{who:x.who.filter(p=>p!==d.person)},'移除人物')}
      else if(T.type==='person'){
        const x=S.items.get(T.id);if(x){
          const ch=[];
          const nw=d.person==='ALL'?PIDS.slice():(x.who.includes(d.person)?x.who:x.who.concat(d.person)).sort((a,b)=>PIDS.indexOf(a)-PIDS.indexOf(b));
          ch.push({col:'items',id:x.id,before:cl(x),after:Object.assign(cl(x),{who:nw})});
          if(d.from&&d.from!==x.id&&d.person!=='ALL'){const s=S.items.get(d.from);if(s)ch.push({col:'items',id:s.id,before:cl(s),after:Object.assign(cl(s),{who:s.who.filter(p=>p!==d.person)})})}
          commit(ch,'分配人物');
        }
      }
    }else if((d.kind==='card'||d.kind==='tl')&&T){
      const it=S.items.get(d.id);
      if(it){
        if(T.type==='trash'){commit([{col:'items',id:it.id,before:cl(it),after:null}],'刪除');if(S.sel===it.id){S.sel=null}}
        else if(T.type==='day'){const ch=placeChanges(it,T.day,itemsOf(T.day).filter(x=>x.id!==it.id).length);commit(ch,'轉日子')}
        else if(T.type==='pool'){const ch=placeChanges(it,0,0,S.pool);commit(ch,'收回備選')}
        else if(T.type==='col'){
          if(d.alt&&it.day===0){
            const cp=Object.assign(cl(it),{id:newId()});delete cp.pool;
            const tmp=Object.assign(cl(cp),{day:T.day});
            const ch=placeChanges(tmp,T.day,T.idx);ch.forEach(c=>{if(c.id===tmp.id)c.before=null});commit(ch,'複製備選');
          }else commit(placeChanges(it,T.day,T.idx),'移動');
        }else if(T.type==='tl'){
          const day=S.day;const cp=Object.assign(cl(it),{day,st:T.st,ord:0});
          if(d.alt&&it.day===0){cp.id=newId();delete cp.pool;commit([{col:'items',id:cp.id,before:null,after:cp}],'複製備選')}
          else commit([{col:'items',id:it.id,before:cl(it),after:cp}],'移動');
        }
      }
    }
    if(d.kind==='tl'&&!T&&d.newSt!=null&&d.newSt!==d.st0)chg(d.id,{st:d.newSt,ord:0},'改時間');
  }
  dirty=false;render();
}
document.addEventListener('click',e=>{if(suppress){e.stopPropagation();e.preventDefault()}},true);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;if(!(t instanceof Element))return;
  const a=t.closest('[data-act]');
  if(!a){
    const c=t.closest('.card[data-id],.tl-item[data-id]');
    if(c&&!t.closest('#drawer')&&!t.closest('a')&&!t.closest('.quick'))openItem(c.dataset.id,false);
    return;
  }
  const act=a.dataset.act,id=a.dataset.id;
  switch(act){
    case 'view':S.view=a.dataset.v;try{history.replaceState(null,'','#'+S.view)}catch(_){}render();break;
    case 'day':S.day=+a.dataset.d;render();break;
    case 'ffil':S.ff.t=a.dataset.v;render();break;
    case 'pfil':S.pf[a.dataset.k]=a.dataset.v;render();break;
    case 'pfz':{const p=S.places.get(a.dataset.pid);if(p&&!S.ro){const v=p.fz===a.dataset.v?'':a.dataset.v;commit([{col:'places',id:p.id,before:cl(p),after:Object.assign(cl(p),{fz:v})}],'可行度')}break}
    case 'ppool':{const p=S.places.get(a.dataset.pid);if(!p||S.ro)break;
      const cm={food:'meal',shop:'shop',sight:'sight',hotel:'hotel',other:'other'};
      const x=norm({day:0,pool:'wish',st:600,du:90,ti:p.nm.replace(/^[((（][^)))）]*[)))）]\s*/,''),cat:cm[p.cat]||'other',who:PIDS.slice(),tg:[],place:p.nm.replace(/^[((（][^)))）]*[)))）]\s*/,''),lat:p.lat,lng:p.lng,notes:'來自 Rachel 研究:'+(p.why||'')+(p.desc?' '+p.desc.slice(0,160):''),status:'none',ord:0},newId());
      commit([{col:'items',id:x.id,before:null,after:x}],'加入備選');toast('已加入備選池(願望清單)');break}

    case 'open':openItem(id,false);break;
    case 'exp':e.stopPropagation();S.exp.has(id)?S.exp.delete(id):S.exp.add(id);render();break;
    case 'status':{e.stopPropagation();const x=S.items.get(id);if(x&&!S.ro)chg(id,{status:x.status==='done'?'todo':'done'},'預約狀態');break}
    case 'fwho':S.who=S.who===a.dataset.p?null:a.dataset.p;render();break;
    case 'ftag':S.tag=S.tag===a.dataset.t?null:a.dataset.t;render();break;
    case 'alerts':S.alerts=!S.alerts;render();break;
    case 'ptab':S.pool=a.dataset.g;render();break;
    case 'undo':undo();break;
    case 'redo':redo();break;
    case 'close':closeDrawer();break;
    case 'edit':S.edit=!S.edit;renderDrawer();break;
    case 'addday':{
      if(S.ro)break;
      const d=+a.dataset.d,L=itemsOf(d),last=L[L.length-1];
      const x=blank(d,last?Math.min(1380,snap(last.st+last.du,5)):540);
      commit([{col:'items',id:x.id,before:null,after:x}],'新增');openItem(x.id,true);break}
    case 'addpool':{
      if(S.ro)break;
      const x=blank(0,540);x.pool=S.pool;x.who=['D','M'];
      commit([{col:'items',id:x.id,before:null,after:x}],'新增備選');openItem(x.id,true);break}
    case 'dwho':{const x=S.items.get(S.sel);if(!x||S.ro)break;const p=a.dataset.p;
      chg(x.id,{who:(x.who.includes(p)?x.who.filter(z=>z!==p):x.who.concat(p)).sort((m,n)=>PIDS.indexOf(m)-PIDS.indexOf(n))},'同行');break}
    case 'dtag':{const x=S.items.get(S.sel);if(!x||S.ro)break;const tg=a.dataset.t;
      chg(x.id,{tg:x.tg.includes(tg)?x.tg.filter(z=>z!==tg):x.tg.concat(tg)},'標籤');break}
    case 'dup':{const x=S.items.get(S.sel);if(!x||S.ro)break;const c=Object.assign(cl(x),{id:newId(),ti:x.ti+'(複製)',ord:x.ord+1});
      commit([{col:'items',id:c.id,before:null,after:c}],'複製');openItem(c.id,true);break}
    case 'del':{
      const x=S.items.get(S.sel);if(!x||S.ro)break;
      if(!S.armDel){S.armDel=true;renderDrawer();setTimeout(()=>{if(S.armDel){S.armDel=false;renderDrawer()}},4000);break}
      S.armDel=false;commit([{col:'items',id:x.id,before:cl(x),after:null}],'刪除');S.sel=null;render();renderDrawer();toast('已刪除(可撤銷)');break}
    case 'bkdone':{const x=S.items.get(id);if(x&&!S.ro)chg(id,{status:a.checked?'done':'todo'},'預約狀態');break}
    case 'todo':{const t=S.todos.get(id);if(t&&!S.ro)commit([{col:'todos',id,before:cl(t),after:Object.assign(cl(t),{done:a.checked})}],'待辦');break}
    case 'deltodo':{const t=S.todos.get(id);if(t&&!S.ro)commit([{col:'todos',id,before:cl(t),after:null}],'刪除待辦');break}
    case 'editnote':S.editNote=S.editNote===id?null:id;render();break;
    case 'delnote':{const n=S.notes.get(id);if(n&&!S.ro){S.editNote=null;commit([{col:'notes',id,before:cl(n),after:null}],'刪除資料')}break}
    case 'addnote':{if(S.ro)break;const id2='n'+Date.now().toString(36);S.editNote=id2;commit([{col:'notes',id:id2,before:null,after:{id:id2,ti:'新資料',body:''}}],'新增資料');break}
    case 'import-json':window.__sa.imp();break;
    case 'export-json':window.__sa.exp();break;
    case 'export-json-old':exportFile('japan-itinerary.json',JSON.stringify({exported:new Date().toISOString(),cfg:S.cfg,items:[...S.items.values()],todos:[...S.todos.values()],notes:[...S.notes.values()]},null,1));break;
    case 'export-csv':exportFile('japan-itinerary.csv','﻿'+toCsv());break;
    case 'export-md':exportFile('japan-itinerary.md',toMd());break;
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'&&S.sel){closeDrawer();return}
  if((e.key==='Enter'||e.key===' ')&&t instanceof Element){
    if(t.matches('.card[data-id],.tl-item[data-id]')){e.preventDefault();openItem(t.dataset.id,false)}
    else if(t.matches('[data-act="status"]')){e.preventDefault();t.click()}
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((t||{}).tagName||'')){e.preventDefault();e.shiftKey?redo():undo()}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!(t instanceof Element)||S.ro)return;
  if(t.id==='rate'){const v=parseFloat(t.value);const b=cl(S.cfg),a=Object.assign(cl(S.cfg)||{},{rate100:v>0?v:null});commit([{col:'cfg',id:'main',before:b,after:a}],'匯率');return}
  if(t.dataset.pf){const p=S.places.get(t.dataset.pid);if(p&&!S.ro)commit([{col:'places',id:p.id,before:cl(p),after:Object.assign(cl(p),{[t.dataset.pf]:t.value})}],'備註');return}
  if(t.dataset.note){const n=S.notes.get(t.dataset.note);if(n)commit([{col:'notes',id:n.id,before:cl(n),after:Object.assign(cl(n),{[t.dataset.f]:t.value})}],'修改資料');return}
  if(t.dataset.act==='bkdone'||t.dataset.act==='todo'){return}
  if(t.closest('#drawer')&&t.dataset.f&&S.sel)setField(S.sel,t.dataset.f,t.value,t);
  else if(t.dataset.act==='todo'||t.dataset.act==='bkdone'){}
});
let qT=0;
document.addEventListener('input',e=>{
  if(e.target.id==='q'){const v=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{S.q=v;render()},180)}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='todoForm'){
    e.preventDefault();if(S.ro)return;
    const txt=$('#todoT').value.trim();if(!txt)return;
    const id='t'+Date.now().toString(36);
    commit([{col:'todos',id,before:null,after:{id,urg:$('#todoU').value,txt,done:false}}],'新增待辦');
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['board','timeline','todo','food','places','info'].includes(h)&&h!==S.view){S.view=h;render()}});

/* ---------- export ---------- */
async function exportFile(name,data){
  let dl=null;try{dl=window.claude&&await Promise.race([claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){}
  if(!dl){toast('此檢視未能匯出檔案');return}
  try{await dl.save({filename:name,data});toast('已儲存 '+name)}catch(e){if(!e||e.code!=='declined')toast('匯出失敗('+((e&&e.code)||'錯誤')+')')}
}
function toCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Day','日期','開始','結束','標題','類別','人員','費用(JPY)','預約狀態','地點','公共交通','計程車','廁所','備註']];
  for(const d of days())for(const x of itemsOf(d.n))rows.push([d.n,d.date,fmt(x.st),fmt(Math.min(1439,x.st+x.du)),x.ti,CATS[x.cat],x.who.map(pname).join('/'),x.cost||'',STATUS[x.status],x.place,x.tr,x.tx,x.wc,x.notes]);
  return rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function toMd(){
  let o='# Japan 2026 家庭行程\n\n';
  for(const d of days()){
    const L=itemsOf(d.n);if(!L.length)continue;
    o+=`## ${dlabel(d)} ${d.title}\n\n`;
    for(const x of L){
      o+=`- **${fmt(x.st)}–${fmt(Math.min(1439,x.st+x.du))}** ${x.ti}(${x.who.length===5?'全員':x.who.map(pname).join('、')})\n`;
      if(x.tr)o+=`  - 交通:${x.tr}\n`;if(x.tx)o+=`  - 計程車:${x.tx}\n`;if(x.cost)o+=`  - 費用:${yen(x.cost)}${x.est?'(估算)':''}\n`;
      if(x.wc)o+=`  - 廁所:${x.wc}\n`;if(x.notes)o+=`  - 備註:${x.notes}\n`;if(x.bk)o+=`  - 預約:${x.bk}\n`;
    }
    o+='\n';
  }
  return o;
}

/* ---------- boot ---------- */
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}
async function boot(){
  const had=loadCache();
  render();chrome();
  if(!window.claude||!claude.use){chrome();return}
  try{
    const [db,user]=await Promise.all([withTimeout(claude.use('db'),10000),withTimeout(claude.use('user'),10000).catch(()=>null)]);
    DB=db;USER=user;
    if(!DB){chrome();if(!had)$('#stage').innerHTML='<div class="panel">未能連接資料庫(可能尚未登入)。請登入 claude.ai 後重新開啟。</div>';return}
    try{if(USER&&USER.can&&USER.can('data.write')===false)S.ro=true}catch(e){}
    const timer=setTimeout(()=>{if(!S.live){chrome();toast('暫時未能同步,顯示快取內容')}},10000);
    const live=snap=>{if(!snap.metadata.fromCache){S.live=true;S.fromCache=false;clearTimeout(timer)}};
    DB.collection('items').onSnapshot(s=>{
      live(s);const m=new Map();s.docs.forEach(d=>m.set(d.id,norm(d.data(),d.id)));
      if(!s.metadata.fromCache||!had||m.size){S.items.clear();m.forEach((v,k)=>S.items.set(k,v))}
      S.got.items=true;saveCache();render();
    },err=>{chrome();if(err&&err.code==='revoked')S.ro=true});
    DB.collection('todos').onSnapshot(s=>{live(s);S.todos.clear();s.docs.forEach(d=>S.todos.set(d.id,Object.assign({},d.data(),{id:d.id})));saveCache();render()},()=>{});
    DB.collection('notes').onSnapshot(s=>{live(s);S.notes.clear();s.docs.forEach(d=>S.notes.set(d.id,Object.assign({},d.data(),{id:d.id})));saveCache();render()},()=>{});
    DB.collection('places').onSnapshot(s=>{live(s);S.places.clear();s.docs.forEach(d=>S.places.set(d.id,Object.assign({},d.data(),{id:d.id})));saveCache();render()},()=>{});
    DB.doc('cfg/main').onSnapshot(s=>{live(s);S.cfg=s.exists?Object.assign({},s.data()):{};saveCache();render()},()=>{});
  }catch(e){chrome()}
}
boot();
window.addEventListener('resize',()=>chrome());
window.__S=S;
})();
